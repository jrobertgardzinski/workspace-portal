# microservice-comments — comment threads + votes (Spring Boot). Verifies
# security's JWTs OFFLINE against its JWKS (the trade-off on display vs memes'
# introspection). Probes on the auto-enabled k8s health groups, like memes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: comments
  labels:
    app: comments
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  # Recreate, not the default RollingUpdate. This service runs an outbox republisher, and the poll
  # is a plain SELECT — no FOR UPDATE SKIP LOCKED, no lease — so two relays alive at once both pick
  # the same batch and both send it. RollingUpdate guarantees exactly that overlap on EVERY deploy:
  # the new pod starts before the old one goes. Consumers are idempotent, so the cost is duplicates
  # rather than damage, but after a broker outage it is a duplicate storm of the whole backlog.
  # The same shape as the offboarding sweeper (P12 S6).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: comments
  template:
    metadata:
      labels:
        app: comments
    spec:
      containers:
        - name: comments
          image: security-comments:latest
          ports:
            # the actuator answers on its own connector (management.server.port=9085) and NO
            # Service or ingress rule routes it: this host is published with a single `/` rule,
            # so anything on 8085 is answerable from a browser
            - name: management
              containerPort: 9085
            - name: http
              containerPort: 8085
          envFrom:
            - configMapRef:
                name: portal-common
          env:
            - name: DB_URL
              value: jdbc:postgresql://comments-postgres:5432/comments
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db
                  key: POSTGRES_PASSWORD
            - name: SECURITY_VERIFY
              value: offline
            - name: MEMES_URL
              value: http://memes:8083
            # The origin the gallery's BROWSER reports when it asks for a thread. comments has its
            # own CORS registration (CommentsConfig#corsForTheGalleryUi) defaulting to compose's
            # http://localhost:8083 — meaningless in a cluster, where the gallery is served from the
            # ingress. Unset, every thread request is refused BY THE BROWSER: nothing reaches this
            # service, nothing is logged, the pod stays Ready and the page simply shows no comments.
            # Comma-separated; see CorsOriginsTest.
            - name: UI_ORIGIN
              value: http://memes.portal.localhost:9080
            - name: KAFKA_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 200m
              memory: 320Mi
            limits:
              memory: 640Mi
---
apiVersion: v1
kind: Service
metadata:
  name: comments
spec:
  selector:
    app: comments
  ports:
    - name: http
      port: 8085
      targetPort: http
