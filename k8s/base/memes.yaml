# microservice-memes — the gallery (Spring Boot; UI at /, uploads/votes need a
# bearer token that security confirms). Spring Boot auto-enables the
# liveness/readiness health groups when it detects Kubernetes, so the probes
# use /actuator/health/{liveness,readiness} instead of the composite /actuator/health
# (whose DB/broker checks would wrongly restart the pod on a dependency blip).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memes
  labels:
    app: memes
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memes
  template:
    metadata:
      labels:
        app: memes
    spec:
      containers:
        - name: memes
          image: security-memes:latest
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: portal-common
          env:
            - name: DB_URL
              value: jdbc:postgresql://memes-postgres:5432/memes
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db
                  key: POSTGRES_PASSWORD
            - name: KAFKA_ENABLED
              value: "true"
            - name: IMAGE_ENCODER_URL
              value: http://image-encoder:8087
            - name: MEMES_BLOB_STORE
              value: s3
            - name: MEMES_S3_ENDPOINT
              value: http://minio:9000
            - name: MEMES_S3_BUCKET
              value: memes
            - name: MEMES_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MEMES_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD
            # JVM-wide cap on concurrent image decodes. The per-image bomb
            # guard (8000px per side) still admits ~256 MB of heap PER DECODE
            # at 16-bit depth, so without this cap N parallel uploads could
            # stack enough decodes to take the heap down; the 4th concurrent
            # decode now waits briefly and is refused with 429 + Retry-After.
            # The memory limit below is sized for exactly this worst case.
            - name: MEMES_DECODE_CONCURRENCY
              value: "3"
            # let the heap actually reach the decode budget: the default 25%
            # of a 1.5Gi limit (~384Mi) could not hold even two worst-case
            # decodes; 70% ≈ 1075Mi covers 3 x ~256Mi + the app's baseline,
            # leaving ~460Mi headroom for metaspace/threads/native
            - name: JDK_JAVA_OPTIONS
              value: "-XX:MaxRAMPercentage=70"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 4
          # sized for MEMES_DECODE_CONCURRENCY=3: three worst-case decodes are
          # ~768Mi of heap on their own, plus the app's working heap and the
          # JVM's non-heap — the old 768Mi limit would OOM under exactly the
          # load the semaphore admits. Request stays modest (decodes are
          # bursts, not steady state); the limit carries the burst.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: memes
spec:
  selector:
    app: memes
  ports:
    - name: http
      port: 8083
      targetPort: http
