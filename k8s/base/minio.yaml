# MinIO — object storage for the gallery's image bytes (memes' S3 ObjectStore
# adapter; the service creates its own bucket on startup). Internal only.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app: minio
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      # Bitnami's image runs as uid 1001 and a PersistentVolume arrives owned by root, so without
      # this the server cannot write its own data directory. Upstream's image ran as root and did
      # not need it — one more line the registry change cost.
      securityContext:
        fsGroup: 1001
      containers:
        - name: minio
          # bitnamilegacy/, because MinIO put its own images behind a login: Docker Hub stopped
          # answering anonymous pulls, then quay.io started answering 401 (2026-09-24), and no
          # other registry carries it. That namespace is frozen and will never be updated again —
          # this pin buys time, not a home. No args: unlike upstream's, this entrypoint runs the
          # server itself, and the data lives under /bitnami/minio/data.
          image: bitnamilegacy/minio:2025.7.23-debian-12-r5
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
          readinessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
