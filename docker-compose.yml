# The PORTAL product: meme gallery (:8083), comments (:8085), the user's saved refs
# (user-collections :8092 + its UI on an own origin :8093) and the account-deletion process
# manager (offboarding :8094) — running on the shared identity stack (security, email chain,
# stub IdP, Kafka), which is defined ONCE in ../shared/docker-compose.identity.yml and
# included here. Jars are built on the host first — use ./infra-up.sh, then
# ../shared/infra-smoke.sh to prove the flows end to end (it needs the formula world too).
#
# The project name stays "security" (pinned in the included identity file and here): all
# product composes share ONE compose project, so dev volumes predate the workspace split
# and portal + formula up together reuse a single identity stack.
#
# Ports on the host:
#   8083  microservice-memes     (gallery UI at /; uploads/votes need signing in)
#   8085  microservice-comments  (comment threads + comment votes)
#   8092  microservice-user-collections (Helidon SE; a user's saved refs; saga participant)
#   8093  collections-ui         (the favourites UI on its own origin — CORS on display)
#   8094  microservice-offboarding (the account-deletion saga's process manager)
#   ----  image-encoder          (internal: PNG->WebP for memes; Python + Pillow)
#   plus the identity stack's ports — see ../shared/docker-compose.identity.yml
#   5434/5435/5436/5437  the memes/comments/collections/offboarding Postgres, 9000 MinIO,
#   8087 image-encoder — internal wiring published so ONE service can run from the IDE against
#   the rest of the stack: ./dev-swap.sh <service> (env files under dev/local/)

name: security

include:
  - ../shared/docker-compose.identity.yml
  - ../shared/docker-compose.observability.yml

x-otel-agent: &otel-agent
  # infra-up.sh exports OTEL_JAVA_TOOL_OPTIONS="" when the agent jar could not be fetched:
  # a -javaagent pointing at a missing file aborts the JVM, which would crash-loop every
  # JVM service instead of the promised "start without tracing" (no-colon ${VAR-...} so an
  # explicitly empty value disables the agent, absence keeps it)
  JAVA_TOOL_OPTIONS: ${OTEL_JAVA_TOOL_OPTIONS--javaagent:/otel/opentelemetry-javaagent.jar}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: none    # metrics already flow through Prometheus scraping
  OTEL_LOGS_EXPORTER: none       # logs already flow through Promtail -> Loki

services:
  memes:
    build:
      context: microservice-memes
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"   # resolves on native Linux/CI too, not only Docker Desktop
    ports:
      - "8083:8083"
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: memes
      # every service refuses to start without a DECLARED deployment profile (ProfileGuard on the
      # java -jar path): this stack is the dev one, and it says so instead of relying on defaults
      SPRING_PROFILES_ACTIVE: dev
      # writes require a bearer token that security confirms; reads (and the UI at :8083) are public.
      # host.docker.internal, not the compose name: security is a SWAPPABLE service (dev-swap.sh),
      # and through the published port the same address reaches it in Docker AND in the IDE
      SECURITY_URL: http://host.docker.internal:8080
      # the gallery is durable: metadata and image bytes in its own Postgres
      DB_URL: jdbc:postgresql://memes-postgres:5432/memes
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      # account-deletion saga (memes axis) + MEME_DELETED announcements for the comments service
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      # smaller WebP to clients that accept it; if the encoder is down, PNG is still served
      IMAGE_ENCODER_URL: http://image-encoder:8087
      # image bytes live in object storage (MinIO speaks S3); metadata stays in Postgres
      MEMES_BLOB_STORE: s3
      MEMES_S3_ENDPOINT: http://minio:9000
      MEMES_S3_BUCKET: memes
      MEMES_S3_ACCESS_KEY: memes
      MEMES_S3_SECRET_KEY: ${MINIO_PASSWORD:-supersecret}
    healthcheck:
      # a real HTTP request against /actuator/health, not just "did the JVM bind the port": with
      # the bare TCP open a memes whose Postgres or MinIO is dead answered 500 to every upload and
      # listing while `docker compose ps` still said healthy — the first thing an operator looks at.
      # Spoken through bash's /dev/tcp because this image (eclipse-temurin:25-jre) ships neither
      # curl nor wget, and the image is another repo's business. Deliberately the BARE
      # /actuator/health, and NOT because the groups are missing here: this service pins
      # management.endpoint.health.probes.enabled=true unconditionally (its application.properties
      # says so in as many words), so /actuator/health/readiness answers 200 or 503 in compose too,
      # never 404 — an earlier version of this comment claimed the opposite and would have sent a
      # reader debugging a health flap off to "fix" the k8s manifests. The bare endpoint is chosen
      # because it AGGREGATES what there is to aggregate, while readiness answers the narrower
      # "should traffic be routed here", which is a Kubernetes question. Be exact about what that
      # aggregate holds, because an earlier version of this comment promised more than it can
      # deliver and an operator would have read a green lamp as "nothing it needs is down":
      # it is the DATASOURCE, diskSpace/ping/ssl, and the saga listener lamp. NOT the broker —
      # that lamp answers "is my listener container running", says so in its own javadoc, and
      # stays UP with Kafka gone. NOT MinIO either: the S3 blob store is a plain awssdk client
      # with no health contributor, so an object store that is away shows here as nothing at all
      # until an upload fails. Two of the three dependencies this service has are unmonitored by
      # this probe. HTTP/1.0 so the
      # server closes the connection itself; the match is anchored on the status line and carries
      # no reason phrase, because Tomcat sends "HTTP/1.1 200 " with the phrase omitted.
      # 9083, not 8083: the actuator moved to its own connector on 2026-07-29 so a saturated
      # request port cannot make a busy service look like a dead one (management.server.port).
      # The port is not published to the host — it does not need to be, this runs inside the
      # container. Leaving the probe on 8083 was the regression that made memes never report
      # healthy at all: the endpoint simply is not there any more.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/9083 && printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "^HTTP/1.[01] 200"']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    volumes:
      - ../shared/observability/otel:/otel:ro   # the OpenTelemetry agent (JAVA_TOOL_OPTIONS above)
    depends_on:
      memes-postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      security:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # object storage for the gallery's image bytes — the S3 ObjectStore adapter's home
  #
  # THE THIRD REGISTRY, and the reason is not a mirror going away: MinIO has put its own images
  # behind a login. docker.io/minio/minio stopped answering anonymous pulls (2026-09-12, "repository
  # does not exist"), we moved to quay.io, and on 2026-09-24 quay started answering 401 too — for
  # the API as well as the registry, so there is no tag left there to fall back to. ghcr.io and
  # public.ecr.aws never carried it. A machine without a cached copy — every CI runner — could not
  # bring the stack up at all.
  #
  # bitnamilegacy/ is MinIO itself, built from source by Bitnami, and the only public copy left.
  # Read the name: that namespace is FROZEN — Broadcom moved the maintained catalogue behind a
  # paid subscription and parked the old images there — so this pin will never get a security
  # update. It buys time, not a home. The version string the binary prints says DEVELOPMENT
  # because Bitnami builds from source rather than shipping MinIO's release artefact.
  #
  # Bitnami's image is configured differently from upstream and the three differences are all here:
  # no `command:` (its entrypoint runs the server), the data lives under /bitnami/minio/data, and
  # it runs as uid 1001. The credentials env vars happen to be the same names.
  #
  # ONE-OFF on a machine that ran the old stack: the existing minio_data volume was written by a
  # root MinIO, and uid 1001 cannot write into it — the container dies on
  # "/bitnami/minio/data/.root_user: Permission denied". Drop it once (`./infra-down.sh -v`, or
  # `docker volume rm security_minio_data`) and the gallery re-fills on the next upload; the dev
  # stack's images are disposable, which is the only reason this is a comment and not a migration.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: always
    ports:
      - "9000:9000"   # for a memes started from the IDE (dev/local/memes.env)
    environment:
      MINIO_ROOT_USER: memes
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-supersecret}
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20

  image-encoder:
    build:
      context: microservice-image
    restart: unless-stopped
    ports:
      - "8087:8087"   # for a memes started from the IDE (dev/local/memes.env)
    # internal only — memes calls it; not published to the host
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8087), 2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  memes-postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5434:5432"   # for a memes started from the IDE (dev/local/)
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: memes
    volumes:
      - memes_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d memes"]
      interval: 3s
      timeout: 3s
      retries: 15

  comments:
    build:
      context: microservice-comments
    restart: unless-stopped
    ports:
      - "8085:8085"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # see memes
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: comments
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://comments-postgres:5432/comments
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SECURITY_URL: http://host.docker.internal:8080
      # the offline trade-off on display: comments verifies security's JWTs against its JWKS
      # instead of calling /me (memes keeps introspection — instant revocation awareness)
      SECURITY_VERIFY: offline
      MEMES_URL: http://host.docker.internal:8083   # swappable service -> via the host, like SECURITY_URL
      # account-deletion saga (comments axis) + the MEME_DELETED thread cascade
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
    healthcheck:
      # the same real HTTP probe as memes, and for the same reason — see the comment there for why
      # it is bash/dev-tcp, why it is the BARE /actuator/health (the aggregate is the right question
      # for a compose healthcheck; the groups are exposed here too, they do not 404) and why the
      # status match carries no reason phrase
      # 9085, not 8085: the actuator moved to its own connector, for the same two reasons as memes
      # — a probe must not time out because the request port is busy, and on the cluster this
      # service is published with a single `/` ingress rule, so anything the request port answers
      # is answerable from a browser. The port is not published to the host; this runs inside the
      # container. Probing 8085 here would healthcheck a 404 forever.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/localhost/9085 && printf "GET /actuator/health HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q "^HTTP/1.[01] 200"']
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    volumes:
      - ../shared/observability/otel:/otel:ro   # the OpenTelemetry agent (JAVA_TOOL_OPTIONS above)
    depends_on:
      comments-postgres:
        condition: service_healthy
      security:
        condition: service_healthy
      kafka:
        condition: service_healthy

  comments-postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5435:5432"   # for a comments started from the IDE (dev/local/)
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: comments
    volumes:
      - comments_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d comments"]
      interval: 3s
      timeout: 3s
      retries: 15

  # the sixth flavour: Helidon 4 SE on virtual threads. The user's saved refs (favourites etc.);
  # the third participant in the account-deletion saga (consumes content-commands, confirms on
  # usercollections-events). Offline JWT like comments; its own Postgres.
  user-collections:
    build:
      context: microservice-user-collections
    restart: unless-stopped
    ports:
      - "8092:8092"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # see memes
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: user-collections
      COLLECTIONS_PROFILE: dev
      COLLECTIONS_PORT: "8092"
      DB_URL: jdbc:postgresql://collections-postgres:5432/collections
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      SECURITY_URL: http://host.docker.internal:8080
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      # busybox wget against the real /health endpoint — a TCP-open check (nc -z) kept
      # reporting healthy while the saga consumer thread was dead. /health itself now watches
      # that thread: it turns 503 once the purge-consumer loop stops completing cycles for
      # longer than COLLECTIONS_CONSUMER_STALL_SEC (default 150s, and the service refuses to
      # boot below that floor — it has to outlast the 90s a single record may legally be
      # retried for), so a dead consumer now
      # flips the container unhealthy instead of hiding behind an open port
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8092/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    volumes:
      - ../shared/observability/otel:/otel:ro   # the OpenTelemetry agent (JAVA_TOOL_OPTIONS above)
    depends_on:
      collections-postgres:
        condition: service_healthy
      security:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # the favourites UI on its OWN origin (react-native-web built by Vite, served by nginx) — the
  # browser then calls security and user-collections cross-origin, exercising their CORS edges
  collections-ui:
    build:
      context: microservice-user-collections/collections-ui
    restart: unless-stopped
    ports:
      - "8093:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  collections-postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5436:5432"   # for a user-collections started from the IDE (dev/local/)
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: collections
    volumes:
      - collections_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d collections"]
      interval: 3s
      timeout: 3s
      retries: 15

  # the portal's process manager for account deletion (the saga orchestration extracted from
  # security): consumes the deletion fact off security-events, commands the content purge on
  # content-commands, collects the participants' confirmations, and announces the single outcome
  # security waits for on offboarding-events. Participants are CONFIGURATION — a new content
  # service joins the saga right here, without touching a line of security.
  offboarding:
    build:
      context: microservice-offboarding
    restart: unless-stopped
    ports:
      - "8094:8094"
    environment:
      <<: *otel-agent
      OTEL_SERVICE_NAME: offboarding
      OFFBOARDING_PROFILE: dev
      OFFBOARDING_PORT: "8094"
      OFFBOARDING_PARTICIPANTS: memes=memes-events,comments=comments-events,collections=usercollections-events
      DB_URL: jdbc:postgresql://offboarding-postgres:5432/offboarding
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    healthcheck:
      # busybox wget against the real /health endpoint — /health now goes 503 when the
      # consumer or sweeper loop is dead, which a TCP-open check (nc -z) never noticed
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8094/health"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s
    volumes:
      - ../shared/observability/otel:/otel:ro   # the OpenTelemetry agent (JAVA_TOOL_OPTIONS above)
    depends_on:
      offboarding-postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  offboarding-postgres:
    image: postgres:18-alpine
    restart: always
    ports:
      - "5437:5432"   # for a offboarding started from the IDE (dev/local/)
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
      POSTGRES_DB: offboarding
    volumes:
      - offboarding_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d offboarding"]
      interval: 3s
      timeout: 3s
      retries: 15

  # NOTE: the identity and observability services are NOT repeated here. They are defined in
  # ../shared/docker-compose.identity.yml and .observability.yml, carry their own
  # `restart: unless-stopped` since 2026-07-28, and arrive through `include:` above. This file
  # used to re-declare each of them just to bolt that policy on — which only newer Compose merges
  # (the runner's refused it outright), and which formula, including the same files, never got.

volumes:
  offboarding_pgdata:
  memes_pgdata:
  minio_data:
  comments_pgdata:
  collections_pgdata:
