# microservice-email (Quarkus) — consumes mail-request events off Kafka and
# delivers over SMTP to Mailpit. The probes are HTTP against /q/health/* (see
# the comment on startupProbe below): the image carries quarkus-smallrye-health
# and every messaging channel's state with it, so a dead mail pipeline behind a
# live HTTP port is visible here. This header used to say the opposite — "no
# /health endpoint in the image, so the k8s probes are TCP as well" — which
# commit 82c26bd made false forty lines further down and left standing. A
# reader who believed it would conclude that a stopped Kafka channel is
# invisible to the cluster, and might "fix" the manifest back to tcpSocket.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email
  labels:
    app: email
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: email
  template:
    metadata:
      labels:
        app: email
    spec:
      containers:
        - name: email
          image: security-email:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: portal-common
          env:
            - name: MAIL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: mail-api-key
                  key: MAIL_API_KEY
            - name: QUARKUS_MAILER_HOST
              value: mailpit
            - name: QUARKUS_MAILER_PORT
              value: "1025"
            - name: QUARKUS_MAILER_MOCK
              value: "false"
            # Mailpit speaks plain SMTP; the prod profile would demand STARTTLS
            - name: MAIL_SMTP_START_TLS
              value: DISABLED
          # NOT tcpSocket. This service's work happens on a Kafka channel, and the channel can
          # shut itself down while the HTTP port stays open — which is what a TCP probe measures.
          # For months the only symptom of a dead mail pipeline would have been users reporting
          # that no verification, reset or MFA mail arrives. quarkus-smallrye-health plus the
          # reactive-messaging extension put every channel's state behind /q/health.
          startupProbe:
            httpGet:
              path: /q/health/started
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 150m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: email
spec:
  selector:
    app: email
  ports:
    - name: http
      port: 8080
      targetPort: http
