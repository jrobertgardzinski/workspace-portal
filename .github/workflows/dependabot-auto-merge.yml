name: Dependabot auto-merge (patch only)

# Merges Dependabot's PATCH updates once CI has gone green, and nothing else.
#
# WHY workflow_run RATHER THAN `gh pr merge --auto`. The `--auto` flag hands the merge to GitHub,
# which then holds it until the branch's REQUIRED checks pass — and this repository has no branch
# protection, so "required checks" is an empty set and auto-merge would land the bump the instant
# it was requested, tested or not. Adding protection would fix that and break something else: it
# would also stand between the owner and their own pushes to main, which is how this estate is
# actually worked on. So the wait is implemented here instead: this job only starts when CI has
# already finished, and only merges when it finished SUCCESSFULLY.
#
# WHY THE BRANCH NAME DECIDES WHAT IS A PATCH. dependabot.yml puts every patch-level update into a
# group called "patches", and a grouped PR always branches as dependabot/<ecosystem>/patches-*.
# Minor and major updates are not in that group, so they arrive on differently-named branches and
# are never touched here — they wait for a human, which is the point of drawing the line at patch.
#
# WHY THE BRANCH NAME IS NOT ENOUGH. A name is not an identity. This repository is public and
# forkable, so anybody may open a PR from a fork with a branch called dependabot/maven/patches-x —
# and a fork run reports the BARE branch name, `gh pr list --head` selects cross-repository PRs,
# and this job runs with the base repository's token. The name alone therefore merged a stranger's
# commits into main, unattended, as soon as CI passed on them. So the identity is checked too: the
# run's actor must be Dependabot itself and the branch must live in THIS repository. `actor.login`
# rather than `triggering_actor`: on a fork run that a maintainer approved, the latter is the
# approver, which would hand the check back to the attacker's PR. The step re-asks the API for the
# same two facts before merging, because the `if` reads the event payload and the step reads the
# PR — a belt and braces worth having on the one job that writes to main on its own.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    # every condition matters: a green run, of a PULL REQUEST (not a push to main), started BY
    # Dependabot, on a branch of THIS repository (not a fork's), named as a patch group
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      contains(github.event.workflow_run.head_branch, '/patches-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Merge the patch bump CI just proved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          # --author pins the PR to Dependabot; without it --head selects by branch name alone,
          # and a fork's branch answers to the same name
          number=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --author 'app/dependabot' \
                     --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            echo "no open Dependabot PR for $BRANCH — already merged, closed, or not Dependabot's"
            exit 0
          fi
          # ask the PR itself, not the event payload: who opened it and whether it comes from a fork
          read -r author cross < <(gh pr view "$number" --repo "$REPO" \
                     --json author,isCrossRepository --jq '[.author.login, .isCrossRepository] | @tsv')
          if [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; then
            echo "::error::PR #$number was opened by $author, not Dependabot — refusing to merge"
            exit 1
          fi
          if [ "$cross" != "false" ]; then
            echo "::error::PR #$number comes from a fork — refusing to merge"
            exit 1
          fi
          # squash: one bump, one commit on main, the PR body kept as the message
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch
