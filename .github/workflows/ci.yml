name: CI

# One workflow for three libraries, because they are now one repository — and that is the point
# of having merged them. While they were three repos in the shared kernel, each carried its own
# checkout list and purge-rule carried none at all: it was built only by the kernel's reactor, so
# nothing tested it against the two services that speak it.
#
# Everything here depends on the KERNEL and nothing in the kernel depends on this. Those two are
# checked out beside this repo and installed first, exactly as the consumers' workflows do it.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: portal-libs
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/user-id
          path: user-id
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/unit-of-work
          path: unit-of-work
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install the kernel libraries these depend on
        run: |
          mvn -B -q --no-transfer-progress -f user-id/pom.xml install -DskipTests
          mvn -B -q --no-transfer-progress -f unit-of-work/pom.xml install -DskipTests
      - name: Build and test every module
        run: mvn -B --no-transfer-progress -f portal-libs/pom.xml clean verify
