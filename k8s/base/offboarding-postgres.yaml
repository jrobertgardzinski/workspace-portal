# Postgres for the offboarding service — its own instance, dev-parity with compose
# (offboarding-postgres). Data on a local-path PVC (k3s' default provisioner);
# strategy Recreate because the volume is ReadWriteOnce.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: offboarding-postgres-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offboarding-postgres
  labels:
    app: offboarding-postgres
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: offboarding-postgres
  template:
    metadata:
      labels:
        app: offboarding-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: offboarding
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "offboarding"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "offboarding"]
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: offboarding-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: offboarding-postgres
spec:
  selector:
    app: offboarding-postgres
  ports:
    - name: pg
      port: 5432
      targetPort: pg
