name: CI

# The PORTAL product workspace. CI recreates the local three-workspace layout — shared/ (the
# kernel) next to portal/ (this repo) — because the e2e harnesses reach the security jar via
# ../../../shared/... exactly like on a developer's disk. The kernel installs first with tests
# skipped (workspace-shared's own CI owns those); the portal reactor then builds WITH tests.
#
# Sub-repos are checked out with REPO_PAT — a fine-grained PAT with Contents:read — because
# some are private and the default GITHUB_TOKEN only reads this repo.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  reactor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this workspace as portal/
        uses: actions/checkout@v4
        with:
          path: portal

      # the shared kernel, laid out exactly as on disk: shared/ + its children
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/workspace-shared
          path: shared
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/adjustable-clock
          path: shared/adjustable-clock
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/infrastructure-micronaut-clock
          path: shared/infrastructure-micronaut-clock
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/transactional-outbox
          path: shared/transactional-outbox
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/infrastructure-spring-outbox
          path: shared/infrastructure-spring-outbox
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/voting
          path: shared/voting
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/offline-jwt
          path: shared/offline-jwt
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/test-starter
          path: shared/test-starter
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/libs   # the constraint lib lives in repo "libs"
          path: shared/constraint
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/config
          path: shared/config
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/email
          path: shared/email
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/password
          path: shared/password
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-security
          path: shared/microservice-security
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-email
          path: shared/microservice-email
          token: ${{ secrets.REPO_PAT }}

      # the portal's own children
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-memes
          path: portal/microservice-memes
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-comments
          path: portal/microservice-comments
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-user-collections
          path: portal/microservice-user-collections
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-offboarding
          path: portal/microservice-offboarding
          token: ${{ secrets.REPO_PAT }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install the shared kernel (tests live in workspace-shared's CI)
        run: ./mvnw -B --no-transfer-progress install -DskipTests
        working-directory: shared

      # Docker is present on ubuntu-latest, so the Testcontainers tests (memes' MinIO
      # round-trip) run rather than skip.
      - name: Build and test the portal reactor
        run: ./mvnw -B --no-transfer-progress clean install
        working-directory: portal

  # The gallery driven through a real browser (cucumber-js + Playwright): the memes-ui harness
  # boots the REAL compose stack (run-e2e.sh -> ../../infra-up.sh) and drives the gallery in it.
  # Its assertions stop at the browser's edge, though — for the account-deletion SAGA (the
  # confirmations, the outcome, the farewell mail) see the sibling workflow e2e-saga.yml, which is
  # nightly and manual rather than per-PR, and says in its own header why.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this workspace as portal/
        uses: actions/checkout@v4
        with:
          path: portal
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/workspace-shared
          path: shared
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/adjustable-clock
          path: shared/adjustable-clock
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/infrastructure-micronaut-clock
          path: shared/infrastructure-micronaut-clock
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/transactional-outbox
          path: shared/transactional-outbox
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/infrastructure-spring-outbox
          path: shared/infrastructure-spring-outbox
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/voting
          path: shared/voting
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/offline-jwt
          path: shared/offline-jwt
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/test-starter
          path: shared/test-starter
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/libs   # the constraint lib lives in repo "libs"
          path: shared/constraint
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/config
          path: shared/config
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/email
          path: shared/email
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/password
          path: shared/password
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-security
          path: shared/microservice-security
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-email
          path: shared/microservice-email
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-memes
          path: portal/microservice-memes
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-comments
          path: portal/microservice-comments
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-user-collections
          path: portal/microservice-user-collections
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-offboarding
          path: portal/microservice-offboarding
          token: ${{ secrets.REPO_PAT }}
      # The four services that carry no Java, and that no Maven job ever needs — but run-e2e.sh
      # now starts the REAL stack (./infra-up.sh, since 2026-07-20: „an end-to-end missing a member
      # proves nothing about the member it skipped"), and `docker compose up --build` builds EVERY
      # service in the merged file. Without these four contexts on disk the build fails before a
      # single container starts, so a job that had been passing on four jars cannot pass any more
      # without them.
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-image
          path: portal/microservice-image
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-idp
          path: shared/microservice-idp
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-sms
          path: shared/microservice-sms
          token: ${{ secrets.REPO_PAT }}
      - uses: actions/checkout@v4
        with:
          repository: jrobertgardzinski/microservice-push
          path: shared/microservice-push
          token: ${{ secrets.REPO_PAT }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # The runner's stock Compose refuses a service that a local file and an included file both
      # name ("services.idp conflicts with imported resource"). This compose does exactly that on
      # purpose: the identity and observability services are DEFINED in ../shared and portal only
      # adds `restart: unless-stopped` on top of them, so a host reboot brings the whole stack back.
      # Newer Compose merges that override, which is why it works on a developer's disk and not
      # here. Pinned to the version the workspace is actually developed against.
      - name: Use a Compose that merges include overrides (see the restart block in docker-compose.yml)
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -sSL https://github.com/docker/compose/releases/download/v5.1.1/docker-compose-linux-x86_64 \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version
      - name: Install the shared kernel (no tests) — feeds ~/.m2 and the security jar
        run: ./mvnw -B -q --no-transfer-progress -pl microservice-security/security-infrastructure -am install -DskipTests
        working-directory: shared
      - name: Install voting (the gallery and comments vote through it)
        run: ./mvnw -B -q --no-transfer-progress -pl voting -am install -DskipTests
        working-directory: shared
      # memes and comments publish their saga events through the outbox, and neither module sits in
      # the closure of security-infrastructure or voting — so without this step the jars above
      # resolve fine and the portal build dies on a missing SNAPSHOT.
      - name: Install the outbox (memes and comments publish their saga events through it)
        run: ./mvnw -B -q --no-transfer-progress -pl transactional-outbox,infrastructure-spring-outbox -am install -DskipTests
        working-directory: shared
      - name: Build the portal jars (deps closure, no tests)
        run: ./mvnw -B -q --no-transfer-progress -pl microservice-memes/memes-infrastructure,microservice-comments,microservice-user-collections -am package -DskipTests
        working-directory: portal

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: portal/microservice-memes/memes-ui/package-lock.json
      - name: Install gallery UI dependencies
        run: npm ci
        working-directory: portal/microservice-memes/memes-ui
      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: portal/microservice-memes/memes-ui
      - name: Drive the gallery through the browser (memes-ui)
        run: ./run-e2e.sh
        working-directory: portal/microservice-memes/memes-ui
      - name: Upload service/UI logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: /tmp/*-e2e-*.log
