spring.application.name=memes-service
server.port=8083

# Uploads can be a few MB; cap them.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Largest side (px) a stored meme may have; bigger uploads are scaled down.
# Where the image bytes live: 'db' (default; their own table, no external service) or
# 'filesystem' (memes.blob-dir) — the stepping stone to S3/MinIO (same ObjectStore port).
memes.blob-store=${MEMES_BLOB_STORE:db}
memes.blob-dir=${MEMES_BLOB_DIR:/var/lib/memes/blobs}

# Finishing the blob deletes a filesystem/S3 store owed and did not perform (pending_blob_deletes,
# V9 — the obligation is written in the same transaction as the meme row, so it survives the pod
# that promised it). Only relevant to the external stores: on 'db' the bytes are rows and go with
# the transaction. GRACE is a safety floor, not a preference: an obligation is written BEFORE its
# transaction commits, so acting on a fresh one could delete the bytes of a meme a rollback then
# restores — 600s is comfortably past the longest transaction here (a purge on the listener thread,
# bounded by max.poll.interval.ms=300s). The sweep also runs once at startup, which is the pass
# that matters after a crash — and the only one without a broker, since @EnableScheduling hangs off
# memes.kafka-enabled (MemeOutboxConfig).
memes.blob-deletes.grace-seconds=${MEMES_BLOB_DELETE_GRACE_SEC:600}
memes.blob-deletes.sweep-interval-ms=${MEMES_BLOB_DELETE_SWEEP_MS:60000}

# Anti-abuse: at most this many uploads per user per minute (429 above it; 0 disables).
memes.upload.rate-limit-per-minute=${MEMES_UPLOAD_RATE_LIMIT:12}

# Anti-abuse, the GLOBAL axis: at most this many image decodes in flight across the whole JVM
# (the per-image 8000px guard still allows ~256 MB per decode at 16-bit depth, and the rate
# limit above is per-user). A request that waits ~5s without a permit gets 429 + Retry-After.
memes.decode.concurrency=${MEMES_DECODE_CONCURRENCY:3}

# Anti-abuse, the axis nobody had: how many uploads may hold RAW BYTES at once. getBytes() spends
# up to max-file-size of heap per request, and the ceiling on requests standing there used to be
# Tomcat's default 200 threads — 2000 MB against a ~1075 MiB heap. 8 x 10 MB = 80 MB, which fits
# beside the decode budget. The per-user rate limit does not help here: it is a counter over a
# window, so one account can have all twelve of its allowance in flight at the same instant.
memes.upload.concurrency=${MEMES_UPLOAD_CONCURRENCY:8}

# And an explicit ceiling on request threads, so the number above is the real limit rather than a
# second one hiding behind a framework default.
server.tomcat.threads.max=${MEMES_TOMCAT_THREADS:32}

# Smaller images to clients that accept WebP: the image-encoder service (empty = disabled, serve
# PNG). A per-meme WebP is encoded once and cached in the object store.
memes.encoder.url=${IMAGE_ENCODER_URL:}
memes.encoder.webp-quality=${IMAGE_ENCODER_WEBP_QUALITY:82}

memes.image.max-dimension=1024
# Largest side (px) of an on-demand thumbnail.
memes.image.thumbnail-max-dimension=256

# Metadata AND bytes live in the database: Postgres on the stack (DB_URL), an in-memory H2 in
# PostgreSQL mode otherwise — the same JDBC adapters either way. Flyway owns the schema.
spring.datasource.url=${DB_URL:jdbc:h2:mem:memes;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

# The connection pool behind the two ceilings above, spelled out for the same reason
# server.tomcat.threads.max is: otherwise the real limit is a framework default nobody chose.
# JdbcMemeRepository.save holds its connection for the whole transaction — the meme row AND the
# image PUT to the bucket — so with MEMES_BLOB_STORE=s3 all memes.upload.concurrency (8) admitted
# uploads can hold one each for as long as MinIO takes to answer. Hikari's default pool is 10,
# which left two connections for the 32 request threads serving the gallery whenever the bucket was
# slow. 16 keeps the uploads to half the pool at worst; what they compete with are reads that
# borrow a connection per statement and give it back in milliseconds (no gallery read is
# transactional).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:16}

# Where microservice-security lives; writes require a bearer token it confirms (GET /me).
security.url=${SECURITY_URL:http://localhost:8080}

# Account-deletion saga: commands arrive on Kafka and confirmations go back; enabled where a
# broker exists (compose). Tests drive the purge use case directly. This service owns the MEMES
# axis of the purge (comments live in microservice-comments): DELETE | ANONYMIZE_AUTHOR |
# KEEP_POPULAR_ANONYMIZED:<minScore>; the deployment default below, the wizard may override it.
memes.purge.memes=${PURGE_MEMES_POLICY:DELETE}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
memes.kafka-enabled=${KAFKA_ENABLED:false}

# earliest, EXPLICIT — Kafka's own default is latest, and latest loses records without a trace: a
# consumer group that has no committed offset yet (a fresh environment, or Kafka switched on after
# this service ran without it) starts AFTER whatever the topic already holds, so purge commands
# published before the group's first poll are simply never seen — no log line, no metric, a saga
# that times out and compensates for no visible reason. earliest walks the retained history instead,
# which costs nothing to repeat: the purge is idempotent (see PurgeCommandsListener), exactly the
# reasoning microservice-user-collections wrote down for the same setting. Pinned by
# KafkaConsumerOffsetResetTest.
spring.kafka.consumer.auto-offset-reset=earliest

# The producer's delivery clocks, EXPLICIT — without them the outbox's "the first attempt never
# blocks the announcing thread" would be a half-truth. KafkaTemplate.send() is asynchronous only
# AFTER the record reaches the accumulator; getting there blocks the CALLING thread on the
# metadata fetch (no partition leader = no metadata) and on a full buffer for up to
# max.block.ms, whose Kafka default is 60s. A purge runs on the Kafka LISTENER thread
# (PurgeCommandsListener) and announces N deletions after one commit, so with the default a
# leaderless memes-events would hold that thread N x 60s — worse than the N x 5s Future.get()
# the outbox replaced, and exactly the max.poll.interval.ms (default 300s) overrun that turns a
# broker outage into a consumer-group rebalance.
#
# 5000 = the same patience RepublisherSettings.defaults gives the republisher's ack (see
# MemeOutboxConfig): ONE "how long do we wait for a broker" number for the whole service, and
# generous enough that a healthy broker's first metadata fetch never trips it. It bounds a stalled
# purge at N x 5s, so the listener stays inside the 300s poll interval up to ~60 memes in one
# purge; beyond that the honest answer is that the first attempt is best effort anyway — the
# outbox row survives a failed send and the library's republisher (scheduler thread, blocking
# allowed) carries the guarantee. Delivery/request match microservice-offboarding's KafkaLoop and
# microservice-user-collections' PurgeCommandsConsumer, so all three services fail over on the
# same clocks.
spring.kafka.producer.properties.max.block.ms=${MEMES_KAFKA_MAX_BLOCK_MS:5000}
spring.kafka.producer.properties.delivery.timeout.ms=${MEMES_KAFKA_DELIVERY_TIMEOUT_MS:30000}
spring.kafka.producer.properties.request.timeout.ms=${MEMES_KAFKA_REQUEST_TIMEOUT_MS:15000}

# Outbox retention: rows marked published survive this many hours, then the republisher's pass
# deletes them — a delivered event has no value once its consumers absorbed it.
memes.outbox.retention-hours=${MEMES_OUTBOX_RETENTION_HOURS:24}

# How often the outbox republisher passes: re-send what the broker never confirmed, reap what it
# demonstrably delivered. Spelled out HERE, without the memes prefix, because the name belongs to
# the shared library (ScheduledOutboxRepublisher.INTERVAL_PROPERTY) — a library owns no
# configuration namespace, so its one @Scheduled dial keeps a neutral one. It has a built-in 15s
# default; the line exists so an operator can FIND the dial in this file instead of in a jar, and
# so the env override has a name. Keep it well below the 30s minimum age a row must reach before
# it is eligible: the effective delay before a re-send is that age plus up to one interval.
outbox.republish-interval-ms=${MEMES_OUTBOX_REPUBLISH_INTERVAL_MS:15000}

# One thread per @Scheduled job. Spring's default scheduler is a pool of ONE, shared by all of
# them, and this service has three: the owed-blob sweep (60s), the erasure backlog watch (60s) and
# the shared library's outbox republisher (15s). The republisher is the one that can sit on a
# thread — with the broker gone, each overdue row costs it up to max.block.ms (5s) before the send
# throws — and while it did, the erasure watch did not run. That watch is a GAUGE, and the only
# alarm that reports erasure marks nobody ever closed, so a pass it misses is a minute the backlog
# is not being reported during exactly the kind of incident it exists for. None of the three is
# heavy; what they needed was not to queue behind one another.
spring.task.scheduling.pool.size=3

# The saga participant's listener loop: its heartbeat and the tolerance the health lamp measures it
# against (SagaListenersHealth). Idle events ARE the heartbeat: the container publishes one per
# interval whenever a poll comes back empty, which is what lets the lamp tell "polling, nothing to
# do" — content-commands is silent for days between account deletions — from "the loop has stopped".
# 10s is a fifteenth of the tolerance below, so a stall is noticed within the tolerance plus one
# interval.
spring.kafka.listener.idle-event-interval=10s

# How long a listener container may go without completing a poll before READINESS reports it. The
# floor (and the default) is 150s and it is derived, not chosen: the retries of one saga command sleep
# ON the consumer thread, and the last attempt of a record can start a whole 90s retry budget
# (SagaRetryBudget) after a first failure that itself followed a 30s Hikari connection timeout, then
# block 30s of its own — 30+90+30. A smaller value would paint every purge riding out a database
# restart as a dead listener; SagaParticipantConfig refuses one, naming this variable.
memes.saga.listener-stall-seconds=${MEMES_LISTENER_STALL_SEC:150}

# observability: correlation id on every log line
# the stack's shared log line (observability/README.md): ISO time, level, cid, trace
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [cid=%X{cid:-}] [trace=%X{trace_id:-}] %logger{24} - %msg%n

# observability: metrics for the workspace's Prometheus (scrape: /actuator/prometheus)
# The probes get a port of their own, away from the traffic they are meant to judge.
#
# Request threads are capped at 32 and an upload may hold its admission permit for up to the
# patience window, so a burst of uploads can occupy every thread on 8083 at once. Sharing that port
# with the liveness probe means the probe times out for the same reason the service is busy — and
# kubelet kills a pod that is merely under load, dropping the very uploads it was working through.
# A separate connector keeps "can this service answer at all?" independent of "is it saturated?".
management.server.port=9083
management.endpoints.web.exposure.include=health,prometheus

# The probe GROUPS, declared here rather than left to Spring's Kubernetes auto-detection, because
# this service now has an opinion about which group a Kafka listener belongs to — and because groups
# that only exist inside k8s cannot be probed on the compose stack where this actually runs.
#
# readiness carries the listener lamp: a participant whose loop has stopped cannot do its share of an
# account deletion, and readiness is the signal that means "do not send me work". liveness deliberately
# does NOT: a stopped listener is not a dead process, and a restart would fix neither the broker nor
# the database that stopped it — the same split microservice-offboarding and microservice-user-collections
# arrived at when they separated /alive from /health. The bare /actuator/health (what the compose
# healthcheck probes) aggregates everything, the listener lamp included.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,kafkaListeners
management.endpoint.health.group.liveness.include=livenessState

# And the details the lamp builds — container ids, states, ages, and "the thread died" as against
# "the poll stalled". Boot's default is never, so every health answer in compose and in the cluster
# was a bare {"status":"DOWN"} and the diagnosis SagaListenersHealth documents reached no operator
# anywhere. It goes in the file rather than being left to a test that sets it for itself: the details
# are PII-free by construction (nothing from a record, see SagaListenersHealth#health), and
# /actuator/health here lives on the management port, away from public traffic.
management.endpoint.health.show-details=always
