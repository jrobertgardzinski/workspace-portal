# Kafka, single-node KRaft — the event backbone (mail requests from security's
# outbox, the account-deletion saga, MEME_DELETED cascades). Dev-parity with
# docker-compose.identity.yml.
#
# Two k8s-specific deltas from compose:
#  - CONTROLLER quorum voter points at localhost, not the `kafka` Service name:
#    the Service has no endpoints until the pod is Ready, so a controller that
#    must reach itself THROUGH the Service to become ready would deadlock.
#  - data on emptyDir, not a PVC (scope: postgresy + minio get PVCs; losing
#    broker state on reschedule is acceptable for a dev cluster — topics are
#    auto-created and every consumer copes with a fresh broker). One exception,
#    and it is not covered by "auto-created": mail-requests-dlq is a COMPACTED
#    ledger, so the postStart hook below creates it with the right config rather
#    than letting the broker defaults quietly give it seven-day deletion.
#
#    That hook used to be a one-shot Job (kafka-topics-init.yaml), and the
#    exception above was therefore only true until the first reschedule. A Job
#    runs ONCE: re-applying the kustomization does not re-run it and nothing
#    tied it to the pod's lifecycle, while emptyDir means every reboot,
#    eviction or `k3d stop/start` takes the topics with it. The broker then
#    auto-created mail-requests-dlq with delete/7d, parked verification, reset
#    and MFA mails started expiring out of the ledger, and /mails/dlq kept
#    answering 200 with a shorter list. Compose never had this hole because it
#    re-asserts the config on every `up` — which is exactly what a postStart
#    hook is: it runs at every pod start, and the script is idempotent by
#    design (--if-not-exists, then --alter).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  labels:
    app: kafka
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          ports:
            - name: broker
              containerPort: 9092
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://:9092,CONTROLLER://:9093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:9092
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@localhost:9093
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
            # the image defaults to a 1G heap; trim it for the ~5-6 GB budget
            - name: KAFKA_HEAP_OPTS
              value: -Xms256m -Xmx512m
          volumeMounts:
            - name: data
              mountPath: /tmp/kraft-combined-logs
          # The one topic that must NOT be left to auto-creation: the mail DLQ ledger.
          #
          # Everything else on this broker is a normal event stream and a fresh broker with
          # auto-created topics is fine for them. `mail-requests-dlq` is not one of them: it is a
          # LEDGER, keyed by request id, which DlqResource reads to answer "what is parked right
          # now?" and writes a tombstone to when an operator redrives an entry. That only works
          # under cleanup.policy=compact with retention.ms=-1 — the same configuration
          # ../../../shared/docker-compose.identity.yml asserts on every `up`.
          #
          # Auto-created, it comes up with the broker defaults: delete policy, seven days. Nothing
          # fails and nothing logs; parked mail simply stops existing after a week while /mails/dlq
          # keeps answering 200 with a shorter and shorter list. That silence is why this is here
          # rather than in a README.
          #
          # postStart, so it runs on EVERY pod start — the data lives on an emptyDir, so every
          # reschedule is a fresh broker that needs the assertion again. It runs concurrently with
          # the broker's own startup, hence the wait loop; the whole script is idempotent, so a
          # restart re-asserting it costs nothing.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/bash
                  - -c
                  - |
                    set -e
                    up=0
                    for attempt in $(seq 1 60); do
                      if /opt/kafka/bin/kafka-broker-api-versions.sh \
                          --bootstrap-server localhost:9092 >/dev/null 2>&1; then
                        up=1
                        break
                      fi
                      sleep 5
                    done
                    if [ "$up" != 1 ]; then
                      # say WHICH thing failed: without this the next line dies with a CLI usage
                      # error and the pod event blames kafka-topics.sh for the broker being late
                      echo "the broker did not answer within 300s; mail-requests-dlq is NOT configured" >&2
                      exit 1
                    fi
                    /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --create --if-not-exists \
                      --topic mail-requests-dlq --partitions 1 --replication-factor 1 \
                      --config cleanup.policy=compact --config retention.ms=-1 --config min.cleanable.dirty.ratio=0.1
                    # --alter as well as --create: the topic may already exist (a consumer that
                    # auto-created it before this hook won the race), and --create --if-not-exists
                    # would then leave the WRONG config in place silently
                    /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --alter \
                      --entity-type topics --entity-name mail-requests-dlq \
                      --add-config cleanup.policy=compact,retention.ms=-1
                    /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --describe \
                      --entity-type topics --entity-name mail-requests-dlq
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: broker
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: broker
