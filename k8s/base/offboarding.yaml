# microservice-offboarding — the account-deletion saga's process manager.
# Participants are CONFIGURATION (OFFBOARDING_PARTICIPANTS) — a new content
# service joins the saga here, without touching security.
#
# Probes — two endpoints, two different questions:
#   /health (READINESS)  503 when a loop stops COMPLETING passes (broker or
#                        database away). Readiness only takes the pod out of
#                        traffic/gating — restarting would not fix the broker,
#                        so liveness must NOT bite here (a down Postgres used
#                        to restart-loop this pod when liveness hit /health).
#   /alive  (LIVENESS)   503 only when a loop THREAD died or stopped being
#                        scheduled (OFFBOARDING_ALIVE_STALL_SEC: code default
#                        240s, floored at a value DERIVED in Main from the
#                        loops' own clocks — the SUM of one worst legal
#                        iteration's blocks (rewind lookup + broker probe +
#                        poll + database + send/flush + commit + max backoff =
#                        146s), plus a 25% margin, currently 183s; the sweeper
#                        loop is measured the same way and comes out shorter,
#                        so the consumer sets the floor. This manifest pins
#                        240s below, on purpose).
#                        A restart is the cure for exactly that and nothing
#                        else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offboarding
  labels:
    app: offboarding
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offboarding
  template:
    metadata:
      labels:
        app: offboarding
    spec:
      containers:
        - name: offboarding
          image: security-offboarding:latest
          ports:
            - name: http
              containerPort: 8094
          envFrom:
            - configMapRef:
                name: portal-common
          env:
            - name: OFFBOARDING_PORT
              value: "8094"
            - name: OFFBOARDING_PARTICIPANTS
              value: memes=memes-events,comments=comments-events,collections=usercollections-events
            - name: DB_URL
              value: jdbc:postgresql://offboarding-postgres:5432/offboarding
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db
                  key: POSTGRES_PASSWORD
            # EXPLICIT on purpose: the liveness verdict must stay strictly slower than the
            # slowest HONEST pass, and that pass is not one clock but a sum — a rewind
            # lookup, a probe, a poll, a database block, a flush, a commit and the backoff,
            # 146s of legal waiting end to end. Was 180s here while the floor in Main was
            # computed as 2x max(...) = 100s; the floor is now the honest sum + 25% = 183s,
            # so 180 would have been SILENTLY RAISED to 183 at boot — a manifest that says
            # one number while the process runs another. 240s (the code default, ~31% above
            # the floor) is the value now, and it is pinned here so the manifest states it
            # rather than inheriting it. Keep in lockstep with ALIVE_STALL_FLOOR in
            # microservice-offboarding's Main: anything below it is silently corrected.
            - name: OFFBOARDING_ALIVE_STALL_SEC
              value: "240"
          # startup gates on /alive (process up, loops scheduled): gating it on
          # /health would restart-loop a freshly booted pod whose Postgres or
          # broker is still coming up — readiness below handles that instead
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # readiness: forgiving thresholds — flapping in and out of the
          # Service on a single slow pass helps nobody; ~30s of failed checks
          # takes the pod out of traffic/gating, recovery puts it back
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # liveness: conservative on purpose — the endpoint itself already
          # waits out OFFBOARDING_ALIVE_STALL_SEC (240s, set explicitly above)
          # before turning 503, so consecutive failures here mean a genuinely
          # dead loop thread; 3x20s on top avoids restarting on a single hiccup
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: offboarding
spec:
  selector:
    app: offboarding
  ports:
    - name: http
      port: 8094
      targetPort: http
