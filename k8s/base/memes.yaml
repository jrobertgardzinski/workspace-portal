# microservice-memes — the gallery (Spring Boot; UI at /, uploads/votes need a
# bearer token that security confirms). Spring Boot auto-enables the
# liveness/readiness health groups when it detects Kubernetes, so the probes
# use /actuator/health/{liveness,readiness} instead of the composite /actuator/health
# (whose DB/broker checks would wrongly restart the pod on a dependency blip).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memes
  labels:
    app: memes
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: memes
  template:
    metadata:
      labels:
        app: memes
    spec:
      containers:
        - name: memes
          image: security-memes:latest
          ports:
            - name: http
              containerPort: 8083
          envFrom:
            - configMapRef:
                name: portal-common
          env:
            - name: DB_URL
              value: jdbc:postgresql://memes-postgres:5432/memes
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db
                  key: POSTGRES_PASSWORD
            - name: KAFKA_ENABLED
              value: "true"
            - name: IMAGE_ENCODER_URL
              value: http://image-encoder:8087
            - name: MEMES_BLOB_STORE
              value: s3
            - name: MEMES_S3_ENDPOINT
              value: http://minio:9000
            - name: MEMES_S3_BUCKET
              value: memes
            - name: MEMES_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_USER
            - name: MEMES_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-creds
                  key: MINIO_ROOT_PASSWORD
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: memes
spec:
  selector:
    app: memes
  ports:
    - name: http
      port: 8083
      targetPort: http
