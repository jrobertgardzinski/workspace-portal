name: CI

# Depends only on unit-of-work, which CI installs first. The reactor CI in the
# aggregator repo validates it with every consumer.

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: meme-deletion
      - uses: actions/checkout@v7
        with:
          repository: jrobertgardzinski/unit-of-work
          path: unit-of-work
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install the library it depends on
        run: mvn -B -q --no-transfer-progress -f unit-of-work/pom.xml install -DskipTests
      - name: Build and test
        run: mvn -B --no-transfer-progress -f meme-deletion/pom.xml clean verify
