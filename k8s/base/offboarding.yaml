# microservice-offboarding — the account-deletion saga's process manager.
# Participants are CONFIGURATION (OFFBOARDING_PARTICIPANTS) — a new content
# service joins the saga here, without touching security.
#
# Probes — two endpoints, two different questions:
#   /health (READINESS)  503 when a loop stops COMPLETING passes (broker or
#                        database away). Readiness only takes the pod out of
#                        traffic/gating — restarting would not fix the broker,
#                        so liveness must NOT bite here (a down Postgres used
#                        to restart-loop this pod when liveness hit /health).
#   /alive  (LIVENESS)   503 only when a loop THREAD died or stopped being
#                        scheduled (OFFBOARDING_ALIVE_STALL_SEC, default 120s
#                        = four max backoffs). A restart is the cure for
#                        exactly that and nothing else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: offboarding
  labels:
    app: offboarding
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: offboarding
  template:
    metadata:
      labels:
        app: offboarding
    spec:
      containers:
        - name: offboarding
          image: security-offboarding:latest
          ports:
            - name: http
              containerPort: 8094
          envFrom:
            - configMapRef:
                name: portal-common
          env:
            - name: OFFBOARDING_PORT
              value: "8094"
            - name: OFFBOARDING_PARTICIPANTS
              value: memes=memes-events,comments=comments-events,collections=usercollections-events
            - name: DB_URL
              value: jdbc:postgresql://offboarding-postgres:5432/offboarding
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db
                  key: POSTGRES_PASSWORD
          # startup gates on /alive (process up, loops scheduled): gating it on
          # /health would restart-loop a freshly booted pod whose Postgres or
          # broker is still coming up — readiness below handles that instead
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # readiness: forgiving thresholds — flapping in and out of the
          # Service on a single slow pass helps nobody; ~30s of failed checks
          # takes the pod out of traffic/gating, recovery puts it back
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # liveness: conservative on purpose — the endpoint itself already
          # waits out OFFBOARDING_ALIVE_STALL_SEC (120s) before turning 503,
          # so consecutive failures here mean a genuinely dead loop thread;
          # 3x20s on top avoids restarting on a single hiccup
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: offboarding
spec:
  selector:
    app: offboarding
  ports:
    - name: http
      port: 8094
      targetPort: http
