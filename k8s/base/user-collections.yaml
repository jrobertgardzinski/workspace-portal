# microservice-user-collections — Helidon SE on virtual threads; the user's
# saved refs and the saga's third participant.
#
# Probes — two endpoints, two different questions:
#   /health (READINESS)  503 when the purge-consumer loop stops COMPLETING
#                        cycles (COLLECTIONS_CONSUMER_STALL_SEC, default 60s)
#                        — broker or database away. Readiness only takes the
#                        pod out of traffic/gating; restarting would not fix
#                        the dependency (a down Postgres used to restart-loop
#                        this pod when liveness hit /health).
#   /alive  (LIVENESS)   503 only when the consumer THREAD died or stopped
#                        being scheduled (COLLECTIONS_ALIVE_STALL_SEC: code
#                        default 240s, floored at a value DERIVED in Main from
#                        the consumer's own clocks — the SUM of one worst legal
#                        iteration's blocks (rewind lookup + broker probe +
#                        poll + database + confirmation send + commit + max
#                        backoff = 146s), plus a 25% margin, currently 183s.
#                        Same arithmetic as offboarding.yaml, term for term.
#                        This manifest pins 240s below, on purpose).
#                        A restart is the cure for exactly that — an open port
#                        no longer hides a corpse, and an outage no longer gets
#                        pods bounced for no gain.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-collections
  labels:
    app: user-collections
    app.kubernetes.io/part-of: portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-collections
  template:
    metadata:
      labels:
        app: user-collections
    spec:
      containers:
        - name: user-collections
          image: security-user-collections:latest
          ports:
            - name: http
              containerPort: 8092
          envFrom:
            - configMapRef:
                name: portal-common
          env:
            - name: COLLECTIONS_PORT
              value: "8092"
            - name: DB_URL
              value: jdbc:postgresql://collections-postgres:5432/collections
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db
                  key: POSTGRES_PASSWORD
            # EXPLICIT on purpose: the liveness verdict must stay strictly slower than the
            # slowest HONEST pass, and that pass is not one clock but a sum — a rewind
            # lookup, a probe, a poll, a database block, a confirmation send, a commit and
            # the backoff, 146s of legal waiting end to end. Was 180s here while the floor
            # in Main was computed as 2x max(...) = 83s; the floor is now the honest sum
            # + 25% = 183s, so 180 would have been SILENTLY RAISED to 183 at boot — a
            # manifest that says one number while the process runs another. 240s (the code
            # default, ~31% above the floor) is the value now, pinned here so the manifest
            # states it rather than inheriting it. Keep in lockstep with ALIVE_STALL_FLOOR
            # in microservice-user-collections' Main: anything below it is corrected.
            - name: COLLECTIONS_ALIVE_STALL_SEC
              value: "240"
          # startup gates on /alive (process up, loop scheduled): gating it on
          # /health would restart-loop a freshly booted pod whose Postgres or
          # broker is still coming up — readiness below handles that instead
          startupProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # readiness: forgiving thresholds — ~30s of failed checks takes the
          # pod out of traffic/gating, recovery puts it back; no restarts here
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # liveness: conservative on purpose — the endpoint itself already
          # waits out COLLECTIONS_ALIVE_STALL_SEC (240s, set explicitly above)
          # before turning 503, so consecutive failures here mean a genuinely
          # dead consumer thread; 3x20s on top avoids restarting on a single
          # hiccup
          livenessProbe:
            httpGet:
              path: /alive
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: user-collections
spec:
  selector:
    app: user-collections
  ports:
    - name: http
      port: 8092
      targetPort: http
